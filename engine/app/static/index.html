<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Translate</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="topbar-title">Realtime Translate</div>
        <div class="status-row">
          <div class="status-pill">
            <span id="engineDot" class="dot"></span>
            <span id="engineStatus">Connecting...</span>
          </div>
          <div class="status-pill">
            <span id="micVadDot" class="dot"></span>
            <span>Mic</span>
          </div>
          <div class="status-pill">
            <span id="peerVadDot" class="dot"></span>
            <span>Peer</span>
          </div>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar-panel" aria-label="Navigasi Pengaturan">
          <nav class="settings-nav" role="tablist" aria-label="Kategori Pengaturan">
            <button
              class="nav-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              data-tab="lang"
            >
              Bahasa &amp; Model
            </button>
            <button
              class="nav-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-tab="audio"
            >
              Routing Audio
            </button>
            <button
              class="nav-tab"
              type="button"
              role="tab"
              aria-selected="false"
              data-tab="advanced"
            >
              Lanjutan
            </button>
          </nav>

          <div class="settings-body">
            <section class="settings-pane" data-pane="lang" role="tabpanel">
              <div class="section">
                <div class="section-head">
                  <span class="section-title">Bahasa &amp; Suara AI</span>
                  <button id="prepareBtn" type="button">Unduh Paket Bahasa</button>
                </div>
                <div class="lang-row">
                  <div class="field">
                    <label for="myLang">Bahasa Saya</label>
                    <select id="myLang"></select>
                  </div>
                  <button id="swapLangBtn" class="icon-btn" type="button" title="Tukar bahasa">⇄</button>
                  <div class="field">
                    <label for="peerLang">Bahasa Lawan Bicara</label>
                    <select id="peerLang"></select>
                  </div>
                </div>
                <div class="stack">
                  <div class="field">
                    <label for="outgoingVoiceSelect">Suara AI Saya (Ke Lawan Bicara)</label>
                    <select id="outgoingVoiceSelect"></select>
                  </div>
                  <div class="field">
                    <label for="incomingVoiceSelect">Suara AI Lawan Bicara (Ke Headphone)</label>
                    <select id="incomingVoiceSelect"></select>
                  </div>
                </div>
                <div id="langProgressWrap" class="progress-row" hidden>
                  <div class="progress-meta">
                    <div class="progress-track"><div id="langProgressBar" class="progress-fill"></div></div>
                    <span id="langProgressText" class="progress-text">0%</span>
                  </div>
                  <button id="cancelLangBtn" class="danger-outline" type="button">Batal</button>
                </div>
              </div>

              <div class="section">
                <div class="section-head">
                  <span class="section-title">Pengenal Suara (STT)</span>
                </div>
                <div class="model-row">
                  <div class="field">
                    <label for="whisperModelSelect">Model Whisper</label>
                    <select id="whisperModelSelect"></select>
                  </div>
                  <button id="applyWhisperBtn" type="button">Pakai Model</button>
                </div>
                <div id="whisperProgressWrap" class="progress-row" hidden>
                  <div class="progress-meta">
                    <div class="progress-track"><div id="whisperProgressBar" class="progress-fill"></div></div>
                    <span id="whisperProgressText" class="progress-text">0%</span>
                  </div>
                  <button id="cancelWhisperBtn" class="danger-outline" type="button">Batal</button>
                </div>
              </div>
            </section>

            <section class="settings-pane" data-pane="audio" role="tabpanel" hidden>
              <div class="section">
                <div class="section-head">
                  <span class="section-title">PipeWire / PulseAudio</span>
                  <div class="controls-group">
                    <button id="setupVirtualBtn" type="button">Setup Virtual</button>
                    <button id="refreshDevBtn" type="button">Refresh</button>
                  </div>
                </div>
                <div class="stack">
                  <div class="field">
                    <label for="micSelect">Mikrofon Fisik (Input)</label>
                    <select id="micSelect"></select>
                  </div>
                  <div class="field">
                    <div class="field-head">
                      <label for="vmicSelect">Virtual Mic Sink (Ke WA/Zoom)</label>
                      <label class="inline-toggle" title="Aktif: kirim suara AI ke lawan bicara. Nonaktif: transkrip teks saja.">
                        <input id="outgoingTtsChk" type="checkbox" checked />
                        <span id="outgoingTtsLabel">Suara AI</span>
                      </label>
                    </div>
                    <select id="vmicSelect"></select>
                  </div>
                  <div class="field">
                    <label for="vspkSelect">Virtual Speaker Monitor (Dari WA/Zoom)</label>
                    <select id="vspkSelect"></select>
                  </div>
                  <div class="field">
                    <div class="field-head">
                      <label for="hpSelect">Headphone / Speaker Fisik (Output)</label>
                      <label class="inline-toggle" title="Aktif: putar suara AI di headphone Anda. Nonaktif: transkrip teks saja.">
                        <input id="incomingTtsChk" type="checkbox" checked />
                        <span id="incomingTtsLabel">Suara AI</span>
                      </label>
                    </div>
                    <select id="hpSelect"></select>
                  </div>
                </div>
              </div>
            </section>

            <section class="settings-pane" data-pane="advanced" role="tabpanel" hidden>
              <div class="section">
                <div class="section-head">
                  <span class="section-title">Engine &amp; VAD</span>
                </div>
                <div class="stack">
                  <div class="field">
                    <label for="translatorBackendSelect">Engine Terjemahan</label>
                    <select id="translatorBackendSelect">
                      <option value="nllb">NLLB-200 (Akurat · Offline)</option>
                      <option value="argos">Argos Translate (Ringan)</option>
                    </select>
                  </div>
                  <div class="field">
                    <div class="field-head">
                      <label for="ttsSpeedSlider">Kecepatan Suara AI</label>
                      <span id="ttsSpeedVal" class="range-val">1.00x</span>
                    </div>
                    <input id="ttsSpeedSlider" type="range" min="75" max="135" value="100" />
                  </div>
                  <div class="field">
                    <div class="field-head">
                      <label for="vadThresholdSlider">Sensitivitas Mic / VAD</label>
                      <span id="vadThresholdVal" class="range-val">350</span>
                    </div>
                    <input id="vadThresholdSlider" type="range" min="150" max="900" step="25" value="350" />
                  </div>
                  <div class="field">
                    <div class="field-head">
                      <label for="vadSilenceSlider">Jeda Akhir Kalimat</label>
                      <span id="vadSilenceVal" class="range-val">750 ms</span>
                    </div>
                    <input id="vadSilenceSlider" type="range" min="400" max="1500" step="50" value="750" />
                  </div>
                  <label class="toggle-chip">
                    <input id="peerAutoLangChk" type="checkbox" />
                    <span>Deteksi Otomatis Bahasa Lawan Bicara</span>
                  </label>
                </div>
              </div>
            </section>
          </div>

          <div class="sidebar-footer">
            <div class="footer-row">
              <button id="startBtn" class="primary" type="button">Mulai Translasi</button>
              <select id="modeSelect" aria-label="Mode Pemicu">
                <option value="vad">Auto VAD</option>
                <option value="ptt">Push-to-Talk</option>
              </select>
            </div>
            <button id="pttBtn" class="ptt-btn" type="button" hidden>Tahan untuk Bicara</button>
            <div class="footer-row footer-meta">
              <label class="toggle-chip">
                <input id="bypassChk" type="checkbox" />
                <span>Bypass Mic</span>
              </label>
              <div class="slider-wrap">
                <label for="duckSlider">Ducking</label>
                <input id="duckSlider" type="range" min="0" max="100" value="18" />
                <span id="duckVal">18%</span>
              </div>
            </div>
          </div>
        </aside>

        <section class="transcript-panel" aria-label="Transkrip Langsung dan Testing">
          <div class="panel-head">
            <span class="section-title">Transkrip Langsung</span>
            <div class="controls-group">
              <span id="hintMsg" class="status-pill hint-pill"></span>
              <button id="pipBtn" type="button">Pop-out Subtitle</button>
            </div>
          </div>

          <div id="feed" class="transcript-feed"></div>

          <div class="test-bar">
            <div class="test-row">
              <input id="testInput" type="text" placeholder="Ketik teks uji coba (contoh: Halo, apa kabar?)" />
              <button id="testOutBtn" type="button">Uji Outgoing</button>
              <button id="testInBtn" type="button">Uji Incoming</button>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
